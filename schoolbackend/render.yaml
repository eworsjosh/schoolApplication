services:
  - type: web
    name: school-backend
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn api.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: school-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: school-db
    plan: free
